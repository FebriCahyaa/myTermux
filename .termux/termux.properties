# MacPro Dark keyboard profile. Termux remains a native Android app;
# these settings style the terminal pane, not the Android window chrome.
extra-keys = [ \
   ['ESC', 'CTRL', 'ALT', 'TAB', {key: KEYBOARD, popup: DRAWER}, 'HOME', 'UP', 'END'], \
   ['SHIFT', '-', '/', ':', ';', 'LEFT', 'DOWN', 'RIGHT', 'BACKSPACE'] \
]

# Safer default. Set true only when you intentionally use external RUN_COMMAND integrations.
allow-external-apps = false

# Open a new terminal with volume-down + t.
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = ctrl + n

terminal-cursor-blink-rate=600
terminal-cursor-style=bar
bell-character=ignore
