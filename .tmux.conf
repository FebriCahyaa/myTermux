# MacPro Dark tmux theme. Self-contained; no external theme pack required.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g status-position bottom
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=#252830,fg=#CDD3E0"
set -g message-style "bg=#89B4FA,fg=#17191F,bold"
set -g pane-border-style "fg=#414653"
set -g pane-active-border-style "fg=#89B4FA"
setw -g window-status-style "fg=#A6ADC8,bg=#252830"
setw -g window-status-current-style "fg=#17191F,bg=#CBA6F7,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g status-left-length 32
set -g status-right-length 64
set -g status-left "#[fg=#A6E3A1,bold] #S #[fg=#585D70]│ "
set -g status-right "#[fg=#89B4FA]%H:%M #[fg=#585D70]│ #[fg=#A6ADC8]%Y-%m-%d "

# Useful splits that work on mobile keyboards as well.
bind | split-window -h
bind - split-window -v
bind r source-file ~/.tmux.conf \; display-message "MacPro Dark configuration reloaded"
